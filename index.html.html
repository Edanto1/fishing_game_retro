<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesca Costa Pacífico - Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: #1b263b;
            border: 4px solid #415a77;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #0d1b2a;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .stat-box {
            font-size: 14px;
            font-weight: bold;
        }
        .stat-value {
            color: #00f5d4;
            font-size: 16px;
        }
        canvas {
            background: #0d1b2a;
            border: 2px solid #778da9;
            border-radius: 6px;
            width: 100%;
            height: 240px;
            image-rendering: pixelated;
        }
        #ui-panel {
            width: 100%;
            margin-top: 8px;
        }
        .btn {
            width: 100%;
            background: #ffb703;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 #fb8500;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #fb8500;
        }
        #log-panel {
            width: 100%;
            height: 85px;
            background: #0d1b2a;
            border: 1px solid #415a77;
            border-radius: 6px;
            padding: 6px;
            font-size: 11px;
            overflow-y: auto;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .log-entry {
            border-bottom: 1px dashed #223344;
            padding-bottom: 2px;
        }
        .log-success { color: #00f5d4; }
        .log-fail { color: #e63946; }
        .log-info { color: #a8dede; }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-box">PUNTOS: <span id="score" class="stat-value">0</span></div>
        <div class="stat-box">CAPTURAS: <span id="catches" class="stat-value">0</span></div>
    </header>

    <canvas id="gameCanvas" width="320" height="240"></canvas>

    <div id="ui-panel">
        <button id="mainBtn" class="btn">LANZAR CAÑA</button>
    </div>

    <div id="log-panel" id="logPanel">
        <div class="log-entry log-info">⚓ Historial listo. ¡Lanza tu caña para comenzar!</div>
    </div>
</div>

<script>
window.onload = function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mainBtn = document.getElementById('mainBtn');
    const scoreEl = document.getElementById('score');
    const catchesEl = document.getElementById('catches');
    const logPanel = document.getElementById('log-panel');

    const FISH_SPECIES = [
        { name: 'Calico Bass', minW: 0.5, maxW: 5.0, basePts: 150, diff: 1.0, color: '#e76f51', stripe: '#f4a261' },
        { name: 'White Seabass', minW: 1.5, maxW: 5.0, basePts: 350, diff: 1.3, color: '#e9c46a', stripe: '#f4a261' },
        { name: 'Jurel', minW: 4.0, maxW: 18.0, basePts: 600, diff: 1.7, color: '#2a9d8f', stripe: '#e9c46a' },
        { name: 'Black Seabass', minW: 15.0, maxW: 65.0, basePts: 1500, diff: 2.2, rare: true, color: '#48cae4', stripe: '#03045e' }
    ];

    let score = 0;
    let catchCount = 0;
    let state = 'IDLE'; 
    let power = 0;
    let powerDir = 1;
    let bobber = { x: 45, y: 120, targetX: 45, targetY: 120 };
    let currentFish = null;
    let fightDistance = 100;
    let tension = 30;
    let sweetZoneStart = 40;
    let sweetZoneWidth = 35;
    let isReeling = false;
    let timer = 0;
    let resultMessage = "";
    let resultColor = "#fff";

    function addLog(text, type = 'info') {
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.innerText = text;
        logPanel.appendChild(div);
        logPanel.scrollTop = logPanel.scrollHeight; // Auto-scroll hacia abajo
    }

    function handleActionStart() {
        if (state === 'IDLE') {
            state = 'POWER';
            power = 0;
            powerDir = 1;
        } else if (state === 'POWER') {
            state = 'CASTING';
            bobber.x = 45;
            bobber.y = 120;
            bobber.targetX = 90 + (power / 100) * 190;
            bobber.targetY = 160 + Math.random() * 30;
        } else if (state === 'BITE') {
            state = 'FIGHT';
            const isRare = Math.random() < 0.15;
            currentFish = isRare ? FISH_SPECIES[3] : FISH_SPECIES[Math.floor(Math.random() * 3)];
            currentFish.weight = (currentFish.minW + Math.random() * (currentFish.maxW - currentFish.minW)).toFixed(1);
            fightDistance = 100;
            tension = 30;
            sweetZoneStart = 30 + Math.random() * 30;
            mainBtn.innerText = "¡RECOGER! (MANTÉN PRESIONADO)";
        } else if (state === 'FIGHT') {
            isReeling = true;
        } else if (state === 'RESULT') {
            state = 'IDLE';
            mainBtn.innerText = "LANZAR CAÑA";
        }
    }

    function handleActionEnd() {
        if (state === 'FIGHT') {
            isReeling = false;
        }
    }

    mainBtn.addEventListener('mousedown', handleActionStart);
    mainBtn.addEventListener('mouseup', handleActionEnd);
    mainBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleActionStart(); });
    mainBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleActionEnd(); });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !e.repeat) handleActionStart();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') handleActionEnd();
    });

    function update() {
        if (state === 'POWER') {
            power += powerDir * 2;
            if (power >= 100) { power = 100; powerDir = -1; }
            if (power <= 0) { power = 0; powerDir = 1; }
            mainBtn.innerText = "FIJAR POTENCIA";
        } else if (state === 'CASTING') {
            bobber.x += (bobber.targetX - bobber.x) * 0.1;
            bobber.y += (bobber.targetY - bobber.y) * 0.1;
            if (Math.abs(bobber.x - bobber.targetX) < 3) {
                state = 'WAITING';
                timer = 80 + Math.random() * 120;
                mainBtn.innerText = "ESPERANDO PICADA...";
            }
        } else if (state === 'WAITING') {
            timer--;
            if (timer <= 0) {
                state = 'BITE';
                timer = 50;
                mainBtn.innerText = "¡ENGANCHAR AHORA!";
                addLog("❗ ¡Un pez ha picado el anzuelo!", "info");
            }
        } else if (state === 'BITE') {
            timer--;
            if (timer <= 0) {
                state = 'RESULT';
                resultMessage = "¡SE ESCAPÓ!";
                resultColor = "#e63946";
                mainBtn.innerText = "CONTINUAR";
                addLog("❌ Reaccionaste tarde: el pez se escapó.", "fail");
            }
        } else if (state === 'FIGHT') {
            sweetZoneStart += Math.sin(Date.now() * 0.003 * currentFish.diff) * 0.7 * currentFish.diff;
            sweetZoneStart = Math.max(10, Math.min(55, sweetZoneStart));

            if (isReeling) {
                tension += 1.6;
            } else {
                tension -= 1.2;
            }

            const inZone = tension >= sweetZoneStart && tension <= (sweetZoneStart + sweetZoneWidth);
            if (inZone) {
                fightDistance -= 0.5;
            } else {
                fightDistance += 0.25;
            }

            if (tension >= 100) {
                state = 'RESULT';
                resultMessage = "¡LÍNEA ROTA!";
                resultColor = "#e63946";
                mainBtn.innerText = "CONTINUAR";
                addLog(`💥 Línea rota luchando con un ${currentFish.name} (${currentFish.weight} kg).`, "fail");
            } else if (tension <= 0 || fightDistance >= 130) {
                state = 'RESULT';
                resultMessage = "¡SE ESCAPÓ!";
                resultColor = "#e63946";
                mainBtn.innerText = "CONTINUAR";
                addLog(`🐟 El ${currentFish.name} (${currentFish.weight} kg) se soltó durante la pelea.`, "fail");
            } else if (fightDistance <= 0) {
                state = 'RESULT';
                const pts = Math.round(currentFish.basePts * parseFloat(currentFish.weight));
                score += pts;
                catchCount++;
                scoreEl.innerText = score;
                catchesEl.innerText = catchCount;
                resultMessage = `¡${currentFish.name.toUpperCase()}!`;
                resultColor = "#00f5d4";
                mainBtn.innerText = "¡CAPTURADO!";
                addLog(`🏆 ¡Captura! ${currentFish.name} | ${currentFish.weight} kg | +${pts} pts`, "success");
            }
        }
    }

    function drawPixelFish(x, y, scale, color, stripeColor) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-20, 0);
        ctx.lineTo(-34, -10);
        ctx.lineTo(-30, 0);
        ctx.lineTo(-34, 10);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-4, -11);
        ctx.lineTo(2, -18);
        ctx.lineTo(10, -11);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-2, 11);
        ctx.lineTo(4, 17);
        ctx.lineTo(8, 11);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = stripeColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-4, -8); ctx.lineTo(-4, 8);
        ctx.moveTo(4, -6); ctx.lineTo(4, 6);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(12, -3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(13, -3, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0d1b2a';
        ctx.fillRect(0, 0, 320, 140);
        ctx.fillStyle = '#ffb703';
        ctx.beginPath();
        ctx.arc(260, 40, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1b263b';
        ctx.beginPath();
        ctx.moveTo(0, 140);
        ctx.lineTo(60, 110);
        ctx.lineTo(130, 135);
        ctx.lineTo(200, 105);
        ctx.lineTo(270, 138);
        ctx.lineTo(320, 125);
        ctx.lineTo(320, 140);
        ctx.fill();

        ctx.fillStyle = '#415a77';
        ctx.fillRect(0, 140, 320, 100);

        ctx.fillStyle = '#778da9';
        const wave = (Date.now() * 0.002) % 20;
        for (let x = -20; x < 340; x += 25) {
            ctx.fillRect(x + wave, 160, 12, 2);
            ctx.fillRect(x - wave * 0.7, 190, 10, 2);
            ctx.fillRect(x + wave * 1.1, 220, 8, 2);
        }

        ctx.fillStyle = '#3d2612';
        ctx.fillRect(0, 130, 40, 110);
        ctx.fillStyle = '#e0e1dd';
        ctx.fillRect(18, 114, 8, 16);
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(20, 108, 6, 6);

        ctx.strokeStyle = '#d4a373';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(24, 118);
        ctx.lineTo(45, 95);
        ctx.stroke();

        if (state === 'CASTING' || state === 'WAITING' || state === 'BITE' || state === 'FIGHT') {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(45, 95);
            ctx.lineTo(bobber.x, bobber.y);
            ctx.stroke();

            const bY = bobber.y + Math.sin(Date.now() * 0.005) * 2;
            ctx.fillStyle = '#e63946';
            ctx.fillRect(bobber.x - 2, bY - 3, 5, 4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bobber.x - 2, bY + 1, 5, 3);
        }

        if (state === 'BITE') {
            ctx.fillStyle = '#ffb703';
            ctx.font = 'bold 22px monospace';
            ctx.fillText('!', bobber.x - 3, bobber.y - 12);
        }

        if (state === 'POWER') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(60, 20, 200, 22);
            ctx.fillStyle = '#ffb703';
            ctx.fillRect(63, 23, (power / 100) * 194, 16);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(60, 20, 200, 22);
        }

        if (state === 'FIGHT') {
            ctx.fillStyle = 'rgba(13, 27, 42, 0.9)';
            ctx.fillRect(30, 12, 260, 48);
            ctx.strokeStyle = '#778da9';
            ctx.strokeRect(30, 12, 260, 48);

            ctx.fillStyle = '#222';
            ctx.fillRect(40, 22, 240, 14);

            const szX = 40 + (sweetZoneStart / 100) * 240;
            const szW = (sweetZoneWidth / 100) * 240;
            ctx.fillStyle = '#2a9d8f';
            ctx.fillRect(szX, 22, szW, 14);

            const tX = 40 + (tension / 100) * 240;
            const inZone = tension >= sweetZoneStart && tension <= (sweetZoneStart + sweetZoneWidth);
            ctx.fillStyle = inZone ? '#00f5d4' : '#e63946';
            ctx.fillRect(tX - 2, 18, 5, 22);

            ctx.fillStyle = '#fff';
            ctx.font = '11px monospace';
            ctx.fillText(`DISTANCIA: ${Math.round(fightDistance)}m`, 40, 52);
        }

        if (state === 'RESULT') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(30, 45, 260, 140);
            ctx.strokeStyle = resultColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 45, 260, 140);

            ctx.fillStyle = resultColor;
            ctx.font = 'bold 14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(resultMessage, 160, 70);

            if (currentFish && fightDistance <= 0) {
                drawPixelFish(160, 110, 1.4, currentFish.color, currentFish.stripe);

                ctx.fillStyle = '#fff';
                ctx.font = '11px monospace';
                ctx.fillText(`PESO: ${currentFish.weight} kg`, 160, 150);
            }
            ctx.textAlign = 'start';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
};
</script>
</body>
</html>
